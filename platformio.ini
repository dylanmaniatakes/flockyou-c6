; =============================================================================
; FlockYou for Seeed Studio XIAO ESP32-C6
; =============================================================================
;
; Why this does not use the stock `platform = espressif32` package:
; PlatformIO's upstream Espressif32 platform currently declares this C6 board
; for ESP-IDF only. This project is Arduino-based, so it pins the pioarduino
; platform release that supplies Arduino-ESP32 3.2.1 and an Arduino-capable
; XIAO ESP32-C6 board definition. Pinning the release makes future builds
; reproducible instead of silently changing the framework underneath us.
; This release uses ESP-IDF 5.4.2, whose C6 controller link interface is
; compatible with NimBLE-Arduino 2.5.0. Newer IDF 5.5.x releases currently
; fail at link time on missing C6 controller ROM memory symbols.
;

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; FlockYou scans only; it never advertises or accepts BLE connections.
    ; Disabling unused NimBLE roles reduces RAM and flash use on the C6.
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    ESP32Async/ESPAsyncWebServer@3.11.2
    bblanchon/ArduinoJson@7.4.2

; The XIAO ESP32-C6 has 4 MB flash and no PSRAM. The custom partition table
; leaves almost 3 MB for this single app and 1 MB for persisted detections.
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
